<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BIVA Admin Login</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --green:#00a86b;
  --green-dark:#007e52;
  --bg:#f3f7f5;
  --text:#101828;
  --white:#fff;
  --border:#e5e7eb;
  --shadow:0 20px 40px rgba(0,0,0,0.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  min-height:100vh;
  background:
  linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
  url('https://images.unsplash.com/photo-1556740749-887f6717d7e4?q=80&w=2070&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-radius:32px;
  padding:40px 32px;
  box-shadow:var(--shadow);
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logo h1{
  font-size:38px;
  font-weight:900;
  color:var(--green-dark);
}

.logo p{
  margin-top:8px;
  color:#667085;
  font-size:14px;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:600;
  color:#344054;
}

.input-group input{
  width:100%;
  height:56px;
  border-radius:18px;
  border:1px solid var(--border);
  padding:0 18px;
  font-size:15px;
  outline:none;
  transition:.3s;
  background:white;
}

.input-group input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 4px rgba(0,168,107,.1);
}

.login-btn{
  width:100%;
  height:56px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,var(--green),var(--green-dark));
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
  margin-top:10px;
}

.login-btn:hover{
  transform:translateY(-2px);
}

.login-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.error{
  background:#fff1f1;
  color:#d92d20;
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
  display:none;
  font-size:14px;
}

.secure-badge{
  margin-top:25px;
  text-align:center;
  color:#667085;
  font-size:13px;
}

.loader{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.3);
  border-top:2px solid white;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

</style>
</head>

<body>

<div class="login-card">

  <div class="logo">
    <h1>BIVA</h1>
    <p>Secure Admin Dashboard Access</p>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="input-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter admin email">
  </div>

  <div class="input-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button class="login-btn" id="loginBtn" onclick="loginAdmin()">
    Login to Dashboard
  </button>

  <div class="secure-badge">
    🔒 Protected & Secured by Firebase Authentication
  </div>

</div>

<script>

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "biva-system.firebaseapp.com",
  projectId: "biva-system",
  storageBucket: "biva-system.appspot.com",
  messagingSenderId: "334844312203",
  appId: "1:334844312203:web:9898fad9ca50c89ebdb28e"
};





firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
auth.setPersistence(
  firebase.auth.Auth.Persistence.LOCAL
);



/* ADMIN EMAILS */

const ADMIN_EMAILS = [
  "brightinternationaldamaturu@gmail.com",
  "nuhuaudu1997@gmail.com"
];

/* AUTO LOGIN CHECK */

let authChecked = false;

auth.onAuthStateChanged((user)=>{

  if(authChecked) return;

  authChecked = true;

  if(
    user &&
    ADMIN_EMAILS.includes(
      user.email.toLowerCase()
    )
  ){

    window.location.replace("admin.html");

  }

});






/* LOGIN */

async function loginAdmin(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const btn =
  document.getElementById("loginBtn");

  const errorBox =
  document.getElementById("errorBox");

  errorBox.style.display = "none";

  if(!email || !password){

    showError("Please fill all fields");
    return;

  }

  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>';

  try{

    const res =
    await auth.signInWithEmailAndPassword(
      email,
      password
    );

    const user = res.user;

    if(
      !ADMIN_EMAILS.includes(
        user.email.toLowerCase()
      )
    ){

      await auth.signOut();

      showError("Unauthorized admin access");
      btn.disabled = false;
      btn.innerHTML = "Login to Dashboard";

      return;

    }

    setTimeout(()=>{

  window.location.href = "admin.html";

},800);

  }catch(error){

    showError(error.message);

    btn.disabled = false;
    btn.innerHTML = "Login to Dashboard";

  }

}

/* ERROR */

function showError(message){

  const errorBox =
  document.getElementById("errorBox");

  errorBox.style.display = "block";
  errorBox.innerText = message;

}

</script>

</body>
</html>
